# =============================================================================
# Campus Connect — Nginx SPA + Reverse Proxy Configuration (P7-11)
# =============================================================================
# Serves:
#   /           → React SPA static assets with HTML5 pushState fallback
#   /api/       → Reverse proxy to FastAPI backend
#   /ws         → WebSocket reverse proxy to FastAPI backend
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root for static files
    root /usr/share/nginx/html;
    index index.html;

    # Tune timeouts for long-lived WebSocket connections
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;

    # ── REST API proxy ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Security: strip upstream's CORS/security headers and let the backend set them
        proxy_pass_header  Content-Security-Policy;
        proxy_pass_header  X-Frame-Options;

        # Buffer tuning for JSON API responses
        proxy_buffer_size          16k;
        proxy_buffers              4 32k;
        proxy_busy_buffers_size    64k;
    }

    # ── Health endpoints (passthrough for Docker Compose service checks) ──────
    location ~ ^/health(/.*)?$ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────────
    # Must be matched BEFORE the SPA fallback because /ws is not a static file.
    location /ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Required WebSocket upgrade headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for real-time frames
        proxy_buffering    off;
        proxy_cache        off;

        # Long-lived connection: keep alive until client disconnects
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── SPA static assets (React build output) ───────────────────────────────
    # Serve static assets with caching; fall back to index.html for SPA routes.
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively; index.html must not be cached
        # (Vite output uses content-hashed filenames for cache busting)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── Healthcheck file (for Docker HEALTHCHECK instruction) ─────────────────
    location = /health.txt {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Security: block hidden files ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary       on;
}

