# =============================================================================
# Campus Connect — Render Blueprint Specification (Phase 2)
# =============================================================================
# Deploys FastAPI backend as a free-tier web service on Render.
# Neon PostgreSQL connection string and Vercel frontend URL are supplied via
# environment variables in the Render dashboard.
# =============================================================================

services:
  - type: web
    name: campus-connect-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render dashboard (Neon PostgreSQL connection string)
      - key: JWT_SECRET_KEY
        generateValue: true # Render automatically generates a 256-bit random secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        sync: false # Set in Render dashboard (e.g. https://<app>.vercel.app)
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_AUTH_PER_MINUTE
        value: "15"
      - key: RATE_LIMIT_DEFAULT_PER_MINUTE
        value: "60"
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,::1,10.0.0.0/8"

